<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>If & For</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <script src="/js/vue.min.js"></script>
</head>
<body class="exercicio">
    <div id="app">
        <p v-for="(aluno, indice) in alunos">{{aluno.nome}} - {{aluno.nota}} - 
            <span v-if="aluno.nota > 9">Quadro de Honra</span>
            <span v-else-if="aluno.nota >= 7">Aprovado</span>
            <span v-else>Reprovado</span>
        </p>

        <ul style="list-style: none;">
            <li v-for="x in 10">
                <span v-show="x >= 4">{{x}}</span>
            </li>
        </ul>
    </div>
    <script>
        new Vue({
            el: "#app",
            data: {
                alunos: [
                    {nome: "Matheus", nota: 10},
                    {nome: "Eduardo", nota: 9},
                    {nome: "Yuri", nota: 8},
                    {nome: "Cadu", nota: 7},
                    {nome: "Bruna", nota: 2},
                ]
            }
        })
    </script>
</body>
</html>
